name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Create archive
        run: |
          tar -czf student-tracker-pro-${{ github.ref_name }}.tar.gz dist/
          zip -r student-tracker-pro-${{ github.ref_name }}.zip dist/

      - name: Generate changelog
        id: changelog
        run: |
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          git log $(git describe --tags --abbrev=0 HEAD^)..HEAD --pretty=format:"- %s" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            student-tracker-pro-${{ github.ref_name }}.tar.gz
            student-tracker-pro-${{ github.ref_name }}.zip
          body: |
            ## 🚀 Release ${{ github.ref_name }}
            
            ### Changes
            ${{ env.CHANGELOG }}
            
            ### Installation
            1. Download the archive
            2. Extract files
            3. Deploy the `dist/` folder to your hosting
            
            ### Configuration
            Set environment variables:
            - `VITE_SUPABASE_URL`
            - `VITE_SUPABASE_ANON_KEY`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
